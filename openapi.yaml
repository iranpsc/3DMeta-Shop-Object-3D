openapi: 3.1.0
info:
  title: 3D RGB Backend API
  version: 1.0.0
  description: |
    OpenAPI documentation for the 3D RGB Laravel backend. The API is versioned under `/api/v1`.
    Cookie-based Sanctum authentication is intended for the first-party SPA. Admin endpoints also
    require a verified account with admin access. Asset proxy endpoints use HTTP Basic authentication.
servers:
  - url: /api/v1
    description: Current backend host
security: []
components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: laravel_session
      description: First-party Laravel Sanctum session cookie.
    basicAuth:
      type: http
      scheme: basic
      description: One-time Basic authentication for asset proxy endpoints.
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Forbidden:
      description: User lacks verified or admin access.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorBody' }
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
  schemas:
    ApiResponse:
      type: object
      properties:
        data: { nullable: true }
        message: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
    PaginatedResponse:
      type: object
      properties:
        data: { type: array, items: {} }
        meta: { $ref: '#/components/schemas/Pagination' }
        links: { type: object, additionalProperties: { type: [string, 'null'] } }
    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    Product:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        slug: { type: string }
        url: { type: string }
        short_description: { type: string }
        long_description: { type: string }
        meta_description: { type: string }
        price: { type: number }
        sale_price: { type: [number, 'null'] }
        final_price: { type: number }
        discount: { type: number }
        is_free: { type: boolean }
        stock_status: { type: boolean }
        quantity: { type: number }
        customer_can_add_review: { type: boolean }
        rating_avg: { type: [number, 'null'] }
        reviews_count: { type: integer }
        approved_reviews_count: { type: integer }
        image: { type: [object, 'null'], additionalProperties: true }
        images: { type: array, items: { type: object, additionalProperties: true } }
        files: { type: array, items: { type: object, additionalProperties: true } }
        tags: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        attributes: { type: array, items: { type: object, additionalProperties: true } }
        category: { $ref: '#/components/schemas/Category' }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        url: { type: string }
        products_count: { type: integer }
        children: { type: array, items: { type: object, additionalProperties: true } }
    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        avatar: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        email_verified_at: { type: [string, 'null'], format: date-time }
    Ticket:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [open, closed] }
        response_status: { type: string, enum: [pending, replied] }
        attachment_url: { type: [string, 'null'], format: uri }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CartSnapshot:
      type: object
      properties:
        items: { type: array, items: { type: object, properties: { product_id: {type: integer}, quantity: {type: integer} } } }
        products: { type: array, items: { $ref: '#/components/schemas/Product' } }
        count: { type: integer }
        total_price: { type: number }
    CheckoutAccountInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [login, register] }
        intended: { type: [string, 'null'], format: uri }
    AddToCartInput:
      type: object
      properties:
        quantity: { type: integer, minimum: 1, default: 1 }
    UpdateCartInput:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    ReviewInput:
      type: object
      required: [comment, rating]
      properties:
        comment: { type: string, minLength: 3, maxLength: 500 }
        rating: { type: integer, minimum: 1, maximum: 5 }
    ReviewReplyInput:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 3, maxLength: 500 }
    TicketInput:
      type: object
      required: [title, message, priority]
      properties:
        title: { type: string, minLength: 3, maxLength: 255 }
        message: { type: string, minLength: 3, maxLength: 5000 }
        priority: { type: string, enum: [low, medium, high] }
        attachment: { type: string, format: binary, description: Optional PDF/JPG/PNG up to 1 MiB. }
    TicketResponseInput:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 500 }
        attachment: { type: string, format: binary, description: Optional file up to 1 MiB. }
    ProfileInput:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string, minLength: 3, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        phone: { type: string, description: Iranian mobile number. }
        avatar: { type: string, format: binary, description: Optional image up to 2024 KiB. }
    StoreAvatarInput:
      type: object
      required: [name, avatar_url, avatar_image_url]
      properties:
        name: { type: string, minLength: 3, maxLength: 255 }
        avatar_url: { type: string, format: uri }
        avatar_image_url: { type: string, format: uri }
    ContactInput:
      type: object
      required: [name, email, phone, subject, message]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email }
        phone: { type: string, description: Iranian mobile number. }
        subject: { type: string, maxLength: 255 }
        message: { type: string, maxLength: 5000 }
    SubmitOrderInput:
      type: object
      required: [subject, message]
      properties:
        name: { type: string, maxLength: 255, description: Required for guests. }
        email: { type: string, format: email, maxLength: 255, description: Required for guests. }
        phone: { type: string, maxLength: 255, description: Required for guests. }
        subject: { type: string, maxLength: 255 }
        message: { type: string }
        attachment: { type: string, format: binary, description: Optional file up to 1 MiB. }
    AdminCategoryInput:
      type: object
      required: [name, slug, description]
      properties:
        name: { type: string, minLength: 3, maxLength: 255 }
        slug: { type: string, minLength: 3, maxLength: 255 }
        parent_id: { type: [integer, 'null'] }
        description: { type: string, minLength: 3, maxLength: 255 }
        image: { type: string, format: binary, description: Optional image up to 1 MiB. }
    AdminTagInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 3, maxLength: 255 }
        slug: { type: string, minLength: 3, maxLength: 255 }
    AdminAttributeInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255 }
    AdminReviewInput:
      type: object
      required: [comment, rating]
      properties:
        comment: { type: string, minLength: 3, maxLength: 500 }
        rating: { type: integer, minimum: 1, maximum: 5 }
    AdminReplyInput:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 3, maxLength: 1000 }
    AdminProductInput:
      type: object
      required: [category_id, name, sku, slug, short_description, long_description, customer_can_add_review, price, published, images, files, tags, attributes, meta_description, meta_keywords]
      properties:
        category_id: { type: integer }
        name: { type: string, maxLength: 255 }
        sku: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255 }
        short_description: { type: string, maxLength: 255 }
        long_description: { type: string, maxLength: 5000 }
        stock_status: { type: boolean }
        quantity: { type: number, minimum: 0 }
        delivery_time: { type: number, minimum: 0 }
        customer_can_add_review: { type: boolean }
        price: { type: number, minimum: 0 }
        sale_price: { type: [number, 'null'], minimum: 0, description: Must not exceed price. }
        published: { type: boolean }
        images: { type: array, minItems: 1, items: { type: string, format: binary, description: Image up to 5 MiB. } }
        files: { type: array, minItems: 1, maxItems: 20, items: { type: object, required: [path, name, mime_type, size], properties: {path: {type: string}, name: {type: string}, mime_type: {type: string}, size: {type: string}} } }
        tags: { type: array, minItems: 1, items: { type: integer } }
        attributes: { type: array, minItems: 1, items: { type: object, required: [id, value], properties: {id: {type: integer}, value: {type: string, maxLength: 255}} } }
        meta_description: { type: string, maxLength: 255 }
        meta_keywords: { type: string, maxLength: 255 }
    ImportProductsInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: XLSX/XLS/CSV file. }
    UploadInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: JPG/PNG/FBX/GLTF/GLB/BIN up to 100 MiB. }
    DiscardUploadInput:
      type: object
      required: [path, name]
      properties:
        path: { type: string }
        name: { type: string }
    ProductResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Product' }
    UserResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/User' }
    TicketResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Ticket' }
    CartResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/CartSnapshot' }
    CategoryResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Category' }
    TagResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Tag' }
    AdminProductResponse:
      type: object
      properties:
        data: { allOf: [{ $ref: '#/components/schemas/Product' }], description: Admin product fields also include published, delivery_time, and category_id. }
    ValidationErrorBody:
      type: object
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
paths:
  /user:
    get:
      tags: [Authentication]
      summary: Get the current authenticated user
      security: [{ sanctumCookie: [] }]
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /logout:
    post:
      tags: [Authentication]
      summary: End the current session
      security: [{ sanctumCookie: [] }]
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products:
    get:
      tags: [Products]
      summary: List published products
      parameters:
        - {in: query, name: sort, schema: {type: string}, description: Sort order (defaults to newest).}
        - {in: query, name: take, schema: {type: integer}}
        - {in: query, name: search, schema: {type: string}}
        - {in: query, name: category, schema: {type: string}}
        - {in: query, name: tag, schema: {type: string}}
        - {in: query, name: tags, schema: {type: string}, description: Comma-separated tag filters.}
        - {in: query, name: price_min, schema: {type: number}}
        - {in: query, name: price_max, schema: {type: number}}
        - {in: query, name: per_page, schema: {type: integer, default: 15}}
        - {in: query, name: page, schema: {type: integer, minimum: 1}, description: Pagination page number.}
      responses:
        '200':
          description: Product list; paginated when applicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /products/store-filters:
    get:
      tags: [Products]
      summary: Get available product filter options
      responses:
        '200':
          description: Product filter data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /products/{sku}:
    get:
      tags: [Products]
      summary: Get a product by SKU
      parameters: [{in: path, name: sku, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{sku}/reviews:
    get:
      tags: [Reviews]
      summary: List approved reviews for a product
      parameters: [{in: path, name: sku, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Reviews and rating summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [Reviews]
      summary: Submit a product review
      description: Requires a Sanctum session. Review payload fields depend on validation rules.
      security: [{sanctumCookie: []}]
      parameters: [{in: path, name: sku, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Review accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reviews/{review}:
    put:
      tags: [Reviews]
      summary: Update a review
      security: [{sanctumCookie: []}]
      parameters: [{in: path, name: review, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reviews/{review}/replies:
    post:
      tags: [Reviews]
      summary: Reply to a review
      security: [{sanctumCookie: []}]
      parameters: [{in: path, name: review, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReplyInput'
      responses:
        '201':
          description: Reply created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /review-replies/{reply}:
    put:
      tags: [Reviews]
      summary: Update a review reply
      security: [{sanctumCookie: []}]
      parameters: [{in: path, name: reply, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReplyInput'
      responses:
        '200':
          description: Reply updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /categories/popular:
    get:
      tags: [Categories]
      summary: List popular categories
      parameters:
        - in: query
          name: take
          required: false
          description: Maximum popular categories; defaults to 12.
          schema: {type: integer}
      responses:
        '200':
          description: Popular categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /categories/top-level:
    get:
      tags: [Categories]
      summary: List top-level categories
      responses:
        '200':
          description: Top-level categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /categories/{slug}:
    get:
      tags: [Categories]
      summary: Get a category by slug
      parameters: [{in: path, name: slug, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Category and descendants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /tags/{slug}/products:
    get:
      tags: [Tags]
      summary: List products for a tag
      parameters: [{in: path, name: slug, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Tagged products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /cart:
    get:
      tags: [Cart]
      summary: Show the current cart
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /cart/{product}:
    post:
      tags: [Cart]
      summary: Add a product to the cart
      parameters: [{in: path, name: product, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartInput'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Cart]
      summary: Update a cart item
      parameters: [{in: path, name: product, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartInput'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Cart]
      summary: Remove a cart item
      parameters: [{in: path, name: product, required: true, schema: {type: integer}}]
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /checkout:
    get:
      tags: [Checkout]
      summary: Show checkout details
      responses:
        '200':
          description: Checkout data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /checkout/account:
    post:
      tags: [Checkout]
      summary: Create or associate a checkout account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutAccountInput'
      responses:
        '200':
          description: Account and checkout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /checkout/payment:
    post:
      tags: [Checkout]
      summary: Begin payment for the current order
      security: [{sanctumCookie: []}]
      responses:
        '200':
          description: Payment redirect information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /checkout/verify:
    get:
      tags: [Checkout]
      summary: Verify a payment gateway return
      description: Uses the gateway return token and order state; auth is optional.
      parameters:
        - in: query
          name: Token
          required: true
          description: Required payment gateway verification token.
          schema: {type: string}
        - in: query
          name: status
          required: false
          description: Gateway transaction status.
          schema: {type: string}
        - in: query
          name: OrderId
          required: false
          description: Gateway order ID.
          schema: {type: string}
        - in: query
          name: TerminalNo
          required: false
          description: Gateway terminal number.
          schema: {type: string}
        - in: query
          name: RRN
          required: false
          description: Retrieval reference number.
          schema: {type: string}
        - in: query
          name: HashCardNumber
          required: false
          description: Masked card hash supplied by gateway.
          schema: {type: string}
        - in: query
          name: Amount
          required: false
          description: Payment amount supplied by gateway.
          schema: {type: string}
      responses:
        '200':
          description: Payment verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /orders/{order}/pay:
    post:
      tags: [Checkout]
      summary: Retry payment for an order
      security: [{sanctumCookie: []}]
      parameters: [{in: path, name: order, required: true, schema: {type: integer}}]
      responses:
        '200':
          description: Payment redirect information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /contact-us:
    post:
      tags: [Contact]
      summary: Submit a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Message submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /submit-order:
    post:
      tags: [Orders]
      summary: Submit an order request
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitOrderInput'
      responses:
        '201':
          description: Order request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /build-package:
    get:
      tags: [Packages]
      summary: Get build package metadata
      responses:
        '200':
          description: Package metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /user/dashboard:
    get:
      tags: [User]
      summary: Get the user dashboard
      security: [{sanctumCookie: []}]
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /user/profile:
    get:
      tags: [User]
      summary: Get the current profile
      security: [{sanctumCookie: []}]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
