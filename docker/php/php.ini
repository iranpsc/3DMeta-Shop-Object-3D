expose_php = Off
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 120
max_input_time = 120
; PHP's transient multipart files must never be staged in the durable product directory.
upload_tmp_dir = /tmp
realpath_cache_size = 4096K
realpath_cache_ttl = 600
date.timezone = UTC
